[project]
name = "support-lab"
version = "0.1.0"
description = "Playground for building and evaluating tool-using agents (MCP, LangGraph, DeepEval)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
support-mcp = "support_lab.mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
