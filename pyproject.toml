[project]
name = "support-lab"
version = "0.1.0"
description = "Playground for building and evaluating tool-using agents (MCP, LangGraph, DeepEval)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "langgraph>=1.2.16",
    "mcp>=2.3.0",
]

[project.scripts]
support-mcp = "support_lab.mcp_server.server:main"
support-agent = "support_lab.agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear, UP pyupgrade, SIM simplify, ASYNC async pitfalls
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
